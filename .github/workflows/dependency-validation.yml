name: Dependency validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Snapshot lockfile
        run: cp package-lock.json "$RUNNER_TEMP/react-todo-lock-before-ci.json"
      - name: Clean install
        id: install
        run: npm ci --no-audit --no-fund
      - name: Verify lockfile was not changed during install
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: cmp package-lock.json "$RUNNER_TEMP/react-todo-lock-before-ci.json"
      - name: Verify dependency tree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm ls --all
      - name: Unit tests
        id: unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=vitest-results.xml
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm exec -- playwright install --with-deps --only-shell chromium
      - name: Browser smoke test
        id: browser
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: playwright-results.xml
        run: npm run test:browser -- --reporter=line,junit
      - name: Record npm audit
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          set -e
          node -e 'const a = require("./npm-audit.json"); if (a.error || !a.metadata || !a.metadata.vulnerabilities) process.exit(1); console.log(a.metadata.vulnerabilities)'
          echo "npm audit exit code: $audit_status (review residual advisories in artifact)"
      - name: Record validation metadata
        if: ${{ !cancelled() }}
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "install=$INSTALL_OUTCOME"
            echo "vitest=$UNIT_OUTCOME"
            echo "build=$BUILD_OUTCOME"
            echo "playwright=$BROWSER_OUTCOME"
            echo "audit_report=$AUDIT_OUTCOME"
          } > validation-results.txt
      - name: Upload validation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-validation-${{ github.event_name }}-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            package-lock.json
            npm-audit.json
            vitest-results.xml
            playwright-results.xml
            validation-results.txt
          if-no-files-found: error
